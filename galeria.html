<script>
/* Galéria: ételfotó-rács + lightbox (önálló, csak ezen az oldalon) */
(function () {
  var GAL = [
    { src: "assets/img/menu/wolf-cover.jpg", cls: "wide", alt: "Wolf Burger" },
    { src: "assets/img/menu/wolf-burger.jpg", cls: "tall", alt: "Wolf burger" },
    { src: "assets/img/menu/fonok-kedvence-burger.jpg", cls: "", alt: "Főnök kedvence burger" },
    { src: "assets/img/menu/smash-burger.jpg", cls: "", alt: "Smash burger" },
    { src: "assets/img/menu/bbq-burger.jpg", cls: "", alt: "BBQ burger" },
    { src: "assets/img/menu/cheddar-burgonyatal.jpg", cls: "wide", alt: "Cheddar sajtszószos burgonyatál" },
    { src: "assets/img/menu/classic-burger.jpg", cls: "", alt: "Classic burger" },
    { src: "assets/img/menu/csirkes-burger.jpg", cls: "", alt: "Csirkés burger" },
    { src: "assets/img/menu/camembert-burger.jpg", cls: "", alt: "Camembert-es vega burger" },
    { src: "assets/img/menu/sajt-burger.jpg", cls: "", alt: "Sajtburger" },
    { src: "assets/img/menu/wolf-closeup.jpg", cls: "tall", alt: "Wolf Burger közelről" },
    { src: "assets/img/menu/churros.jpg", cls: "", alt: "Churros" },
    { src: "assets/img/menu/nuggets-burger.jpg", cls: "", alt: "Csirke nuggets burger" },
    { src: "assets/img/menu/hagymakarika.jpg", cls: "", alt: "Hagymakarikák" },
    { src: "assets/img/menu/v-burgonya.jpg", cls: "", alt: "„V” alakú héjas burgonyacikk" },
    { src: "assets/img/menu/mini-burger.jpg", cls: "", alt: "Mini burger" }
  ];
  var grid = document.getElementById("galleryGrid");
  if (!grid) return;
  GAL.forEach(function (g, i) {
    var a = document.createElement("a");
    a.className = "gitem" + (g.cls ? " " + g.cls : "");
    a.href = g.src; a.setAttribute("data-i", i);
    a.innerHTML = '<img src="' + g.src + '" alt="' + g.alt + '" loading="lazy">' +
      '<span class="gitem__zoom"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg></span>';
    grid.appendChild(a);
  });

  var lb = document.getElementById("lightbox"), img = document.getElementById("lbImg");
  var cur = 0;
  function open(i) { cur = (i + GAL.length) % GAL.length; img.src = GAL[cur].src; img.alt = GAL[cur].alt; lb.classList.add("open"); lb.setAttribute("aria-hidden", "false"); }
  function close() { lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); }
  grid.addEventListener("click", function (e) {
    var a = e.target.closest(".gitem"); if (!a) return;
    e.preventDefault(); open(parseInt(a.getAttribute("data-i"), 10));
  });
  document.getElementById("lbClose").addEventListener("click", close);
  document.getElementById("lbPrev").addEventListener("click", function () { open(cur - 1); });
  document.getElementById("lbNext").addEventListener("click", function () { open(cur + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") open(cur - 1);
    else if (e.key === "ArrowRight") open(cur + 1);
  });
})();
</script>
